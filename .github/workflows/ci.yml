
name: Indah Tracker CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build Next.js
        run: npm run build
        env:
          DATABASE_URL: "mysql://ci_user:ci_password@127.0.0.1:3306/indah_tracker_ci"
          NEXTAUTH_SECRET: "ci-only-placeholder-secret-for-build"
          AUTH_SECRET: "ci-only-placeholder-secret-for-build"
